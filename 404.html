<!doctype html>
<html lang="id">
<head>
  <!-- TAG: Standalone error metadata - works when index.html cannot be loaded. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>System message — monolit.dav</title>
  <style>
    /* TAG: Error page foundation - self-contained so it survives missing CSS,
       missing JavaScript, and an unreachable main document. */
    :root{--bg:#0b0b0b;--panel:#121315;--line:rgba(255,255,255,.13);--text:#f3f4f5;--muted:#a4a8ad}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#202225 0,transparent 44%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .error-shell{width:min(980px,100%);padding:clamp(22px,5vw,56px);border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018));box-shadow:0 24px 80px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.07)}
    .error-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(240px,360px);align-items:center;gap:clamp(20px,5vw,76px)}
    .error-copy{min-width:0}.eyebrow{margin:0 0 12px;color:var(--muted);font:600 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em}
    h1{margin:0 0 10px;font:400 clamp(32px,5vw,52px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
    .message{max-width:38ch;margin:0;color:var(--muted);font-size:14px;line-height:1.65}
    .detail{max-width:42ch;margin:14px 0 0;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(0,0,0,.3);color:#d8dadd;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:10px 14px;border-radius:9px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
    .primary{border:1px solid #d5d7d9;background:#d5d7d9;color:#111214}.secondary{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:var(--text)}
    .actions a:hover,.actions a:focus-visible{transform:translateY(-1px);border-color:#fff}.actions a:focus-visible{outline:2px solid #fff;outline-offset:3px}

    /* TAG: Supplied TV construction - same antenna, screen, controls, and
       404 silhouette; only orange/colorful values are mapped to monochrome. */
    .main_wrapper{position:relative;display:flex;align-items:center;justify-content:center;width:min(30em,100%);height:30em}
    .main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:5em;transform:scale(.92)}
    .antenna{position:relative;width:5em;height:5em;margin-bottom:-6em;border:2px solid #050505;border-radius:50%;background:#8e9398;z-index:0}
    .antenna_shadow{position:absolute;width:50px;height:56px;margin-left:1.68em;border:4px solid transparent;border-radius:45%;box-shadow:inset 0 16px #555b60;transform:rotate(140deg)}
    .antenna:after,.antenna:before{content:"";position:absolute;border-radius:50%;background:#c9cccf}.antenna:after{width:1em;height:.5em;margin:-9.4em 0 0 .4em;transform:rotate(-25deg)}.antenna:before{width:1.5em;height:.8em;margin:.2em 0 0 1.25em;transform:rotate(-20deg)}
    .a1,.a2{position:relative;background:linear-gradient(#17191b,#383c40,#17191b);clip-path:polygon(50% 0%,49% 100%,52% 100%)}.a1{top:-102%;left:-130%;width:12em;height:5.5em;border-radius:50px;transform:rotate(-29deg)}.a2{top:-210%;left:-10%;width:12em;height:4em;margin-right:5em;border-radius:50px;clip-path:polygon(47% 0,47% 0,34% 34%,54% 25%,32% 100%,29% 96%,49% 32%,30% 38%);transform:rotate(-8deg)}
    .a1d,.a2d{position:relative;width:.5em;height:.5em;border:2px solid #080808;border-radius:50%;background:#aeb3b7;z-index:2}.a1d{top:-211%;left:-35%;transform:rotate(45deg)}.a2d{top:-294%;left:94%}
    .tv{position:relative;display:flex;justify-content:center;width:17em;height:9em;margin-top:3em;border:2px solid #070707;border-radius:15px;background:#5b6065;box-shadow:inset .2em .2em #aeb3b7}
    .tv:after{content:"";position:absolute;inset:0;border-radius:15px;background:repeating-radial-gradient(#fff 0 .0001%,#000 0 .0002%) 50% 0/2500px 2500px;mix-blend-mode:soft-light;opacity:.1;pointer-events:none}
    .display_div{display:flex;align-items:center;align-self:center;justify-content:center;border-radius:15px;box-shadow:3.5px 3.5px 0 #aeb3b7}.screen_out1{display:flex;align-items:center;justify-content:center;width:11em;height:7.75em;border-radius:10px}
    .screen,.screenM{display:flex;align-items:center;justify-content:center;width:13em;height:7.85em;border:2px solid #050505;border-radius:10px;background:repeating-radial-gradient(#000 0 .0001%,#fff 0 .0002%) 50% 0/2500px 2500px;color:#fff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;letter-spacing:.08em;text-align:center;animation:staticNoise .22s steps(2) infinite alternate;overflow:hidden}.screenM{display:none}
    .notfound_text{position:relative;max-width:88%;padding:.3em .45em;border-radius:4px;background:#050505;color:#fff;font-size:.72em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}@keyframes staticNoise{to{background-position:45% 50%}}
    .lines{display:flex;align-self:flex-end;column-gap:.1em}.line1,.line2,.line3{width:2px;background:#080808;border-radius:25px 25px 0 0}.line1,.line3{height:.5em;margin-top:.5em}.line2{height:1em}
    .buttons_div{display:flex;align-items:center;justify-content:center;flex-direction:column;row-gap:.75em;width:4.25em;height:8em;align-self:center;padding:.6em;border:2px solid #070707;border-radius:10px;background:#73787d;box-shadow:3px 3px 0 #aeb3b7}
    .b1,.b2{position:relative;width:1.65em;height:1.65em;border:2px solid #080808;border-radius:50%;background:#454a4f;box-shadow:inset 2px 2px 1px #8d9398,-2px 0 #25282b,-2px 0 0 1px #080808}.b1:after,.b2:after{content:"";position:absolute;top:.26em;left:.68em;width:.15em;height:1.05em;background:#080808;transform:rotate(45deg)}
    .speakers{display:flex;flex-direction:column;row-gap:.5em}.g1{display:flex;column-gap:.25em}.g11,.g12,.g13{width:.65em;height:.65em;border:2px solid #080808;border-radius:50%;background:#454a4f;box-shadow:inset 1.25px 1.25px 1px #8d9398}.g{width:2.2em;height:2px;background:#17191b}
    .bottom{display:flex;align-items:center;justify-content:center;width:100%;column-gap:8.7em}.base1,.base2{width:2em;height:1em;margin-top:-.15em;border:2px solid #17191b;background:#4d5155}.base3{position:absolute;width:17.5em;height:.15em;margin-top:.8em;background:#17191b}
    .text_404{position:absolute;display:flex;align-items:center;justify-content:center;column-gap:6em;margin-bottom:2em;opacity:.14;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;z-index:-1}.text_4041,.text_4042,.text_4043{transform:scaleY(24.5) scaleX(9)}
    @media (max-width:760px){body{padding:14px}.error-shell{padding:24px 18px}.error-layout{grid-template-columns:1fr;gap:0}.main_wrapper{height:19em;margin:-14px auto -8px}.main{transform:scale(.62)}.error-copy{text-align:center}.message,.detail{margin-inline:auto}.actions{justify-content:center}.screen{display:none}.screenM{display:flex}}
    @media (prefers-reduced-motion:reduce){.screen,.screenM{animation:none}.actions a{transition:none}}
  </style>
</head>
<body>
  <!-- TAG: Standalone error layout - remains usable with JavaScript disabled. -->
  <main class="error-shell" role="main">
    <div class="error-layout">
      <div class="main_wrapper" aria-hidden="true">
        <div class="main">
          <div class="antenna"><div class="antenna_shadow"></div><div class="a1"></div><div class="a1d"></div><div class="a2"></div><div class="a2d"></div></div>
          <div class="tv">
            <div class="display_div"><div class="screen_out1"><div class="screen"><span class="notfound_text" id="error-screen">404</span></div><div class="screenM"><span class="notfound_text">404</span></div></div></div>
            <div class="lines"><div class="line1"></div><div class="line2"></div><div class="line3"></div></div>
            <div class="buttons_div"><div class="b1"></div><div class="b2"></div><div class="speakers"><div class="g1"><div class="g11"></div><div class="g12"></div><div class="g13"></div></div><div class="g"></div><div class="g"></div></div></div>
            <div class="bottom"><div class="base1"></div><div class="base2"></div><div class="base3"></div></div>
          </div>
          <div class="text_404"><div class="text_4041">4</div><div class="text_4042">0</div><div class="text_4043">4</div></div>
        </div>
      </div>
      <div class="error-copy">
        <p class="eyebrow">MONOLIT.DAV / SYSTEM MESSAGE</p>
        <h1 id="error-title">Halaman tidak ditemukan</h1>
        <p class="message" id="error-message">Alamat yang kamu buka tidak tersedia. Cek URL atau kembali ke portfolio.</p>
        <p class="detail" id="error-detail" hidden></p>
        <div class="actions"><a class="primary" id="retry" href="">Coba lagi</a><a class="secondary" id="home" href="./">Kembali ke portfolio</a></div>
      </div>
    </div>
  </main>
  <script>
    /* TAG: Error state resolver - supports 404, offline, unreachable, and
       explicit runtime details through query parameters without dependencies. */
    (function(){
      'use strict';
      var title=document.getElementById('error-title'), message=document.getElementById('error-message'), detail=document.getElementById('error-detail'), screen=document.getElementById('error-screen'), retry=document.getElementById('retry');
      var params=new URLSearchParams(location.search), requested=params.get('error'), technical=params.get('msg')||'';
      var states={
        offline:{code:'OFFLINE',title:'Tidak ada koneksi internet',message:'Portfolio masih tersedia, tetapi jaringan sedang offline. Sambungkan internet lalu coba lagi.'},
        unreachable:{code:'UNREACHABLE',title:'Situs tidak bisa dijangkau',message:'Server atau jaringan tidak merespons. Periksa koneksi lalu coba lagi.'},
        error:{code:'ERROR',title:'Terjadi kesalahan',message:'Halaman mengalami error. Detail teknis ditampilkan agar lebih mudah diperbaiki.'},
        'not-found':{code:'404',title:'Halaman tidak ditemukan',message:'Alamat yang kamu buka tidak tersedia. Cek URL atau kembali ke portfolio.'}
      };
      var state=states[requested]||(!navigator.onLine?states.offline:states['not-found']);
      var safe=String(technical).slice(0,220);
      screen.textContent=safe?state.code+': '+safe.slice(0,52):state.code; title.textContent=state.title; message.textContent=state.message;
      if(safe){detail.textContent='Detail: '+safe;detail.hidden=false}
      retry.href=location.href;
      window.addEventListener('online',function(){ if(state===states.offline) location.reload() });
    }());
  </script>
</body>
</html>
