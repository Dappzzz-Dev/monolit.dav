<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0b;color:#fff;font-family:'Space Mono',ui-monospace,monospace}
    .wrap{text-align:center;padding:2rem}
    .code{font-size:clamp(64px,12vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1;opacity:.12;position:relative}
    .code::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
    .msg{margin-top:1.5rem;font-size:14px;opacity:.5;letter-spacing:.04em}
    .go{margin-top:2rem;display:inline-block;padding:10px 20px;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;text-decoration:none;font-size:13px;transition:all .2s}
    .go:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Halaman ini tidak ditemukan atau tidak ada.</p>
    <a class="go" href="/">Kembali ke beranda</a>
  </div>
</body>
</html>
