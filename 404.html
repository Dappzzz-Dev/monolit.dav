  <style>

    /* TAG: Monochrome/dark adapter - background halaman gelap, teks putih */

      background: #0b0b0b;
      color: #ffffff;

    .main_wrapper {

        inset 0px 16px #a85103,

      -moz-box-shadow:
        inset 0px 16px #a85103,
        inset 0px 16px 1px 1px #a85103;
    }
    .antenna::after {
      content: "";
      position: absolute;
      margin-top: -9.4em;
      margin-left: 0.4em;
      transform: rotate(-25deg);
      width: 1em;
      height: 0.5em;
      border-radius: 50%;
      background-color: #f69e50;
    }
    .antenna::before {
      content: "";
      position: absolute;
      margin-top: 0.2em;
      margin-left: 1.25em;
      transform: rotate(-20deg);
      width: 1.5em;
      height: 0.8em;
      border-radius: 50%;

    }
    .a1 {
      position: relative;
      top: -102%;
      left: -130%;
      width: 12em;
      height: 5.5em;
      border-radius: 50px;
      background-image: linear-gradient(
        #171717,
        #171717,
        #353535,
        #353535,
        #171717
      );
      transform: rotate(-29deg);
      clip-path: polygon(50% 0%, 49% 100%, 52% 100%);
    }
    .a1d {
      position: relative;
      top: -211%;
      left: -35%;
      transform: rotate(45deg);
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }
    .a2 {
      position: relative;
      top: -210%;
      left: -10%;
      width: 12em;
      height: 4em;
      border-radius: 50px;
      background-color: #171717;
      background-image: linear-gradient(
        #171717,
        #171717,
        #353535,
        #353535,
        #171717
      );
      margin-right: 5em;
      clip-path: polygon(
        47% 0,
        47% 0,
        34% 34%,
        54% 25%,
        32% 100%,
        29% 96%,
        49% 32%,
        30% 38%
      );
      transform: rotate(-8deg);
    }
    .a2d {
      position: relative;
      top: -294%;
      left: 94%;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      border: 2px solid black;
      background-color: #979797;
      z-index: 99;
    }

    .notfound_text {
      background-color: black;
      padding-left: 0.3em;
      padding-right: 0.3em;
      font-size: 0.75em;
      color: white;
      letter-spacing: 0;
      border-radius: 5px;
      z-index: 10;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv {

      height: 9em;
      margin-top: 3em;
      border-radius: 15px;
      background-color: #d36604;
      display: flex;
      justify-content: center;
      border: 2px solid #1d0e01;

    }
    .tv::after {

      background:
        repeating-radial-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 50% 0/2500px

        repeating-conic-gradient(#d36604 0 0.0001%, #00000070 0 0.0002%) 60% 60%/2500px
          2500px;
      background-blend-mode: difference;
      opacity: 0.09;
    }
    .curve_svg {
      position: absolute;
      margin-top: 0.25em;
      margin-left: -0.25em;
      height: 12px;
      width: 12px;
    }
    .display_div {
      display: flex;
      align-items: center;
      align-self: center;
      justify-content: center;
      border-radius: 15px;

    .screen_out {

    .screen_out1 {

    }
    .screen {
      width: 13em;
      height: 7.85em;
      font-family: Montserrat;
      border: 2px solid #1d0e01;
      background:
        repeating-radial-gradient(#000 0 0.0001%, #ffffff 0 0.0002%) 50% 0/2500px
          2500px,
        repeating-conic-gradient(#000 0 0.0001%, #ffffff 0 0.0002%) 60% 60%/2500px
          2500px;

      animation: b 0.2s infinite alternate;

      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #252525;

    .screenM {
      width: 13em;
      height: 7.85em;
      position: relative;
      font-family: Montserrat;
      background: linear-gradient(
        to right,
        #002fc6 0%,
        #002bb2 14.2857142857%,
        #3a3a3a 14.2857142857%,
        #303030 28.5714285714%,
        #ff0afe 28.5714285714%,

        #6c6c6c 42.8571428571%,
        #626262 57.1428571429%,
        #0affd9 57.1428571429%,

    .screenM:before,

        #ffe60a 14.2857142857%,

        #10ea00 42.8571428571%,
        #0ed600 57.1428571429%,
        #ff0afe 57.1428571429%,

        #ed0014 71.4285714286%,

        #002bb2 100%

    }
    .screenM:after {
      bottom: 0;
      height: 21.7391304348%;
      background: linear-gradient(
        to right,
        #006c6b 0%,
        #005857 16.6666666667%,
        white 16.6666666667%,
        #fafafa 33.3333333333%,
        #001b75 33.3333333333%,
        #001761 50%,
        #6c6c6c 50%,
        #626262 66.6666666667%,
        #929292 66.6666666667%,
        #888888 83.3333333333%,
        #3a3a3a 83.3333333333%,
        #303030 100%
      );
    }

    .text_404 {

    }

      transform: scaleY(24.5) scaleX(9);

    .text_4043 {

      }

      }
      .text_4042 {

    @media (max-width: 275px), (max-height: 520px) {

      }
    }
    @media only screen and (min-width: 1025px) {
      .screen {
        display: flex;

    /* =====================================================================
       TAG: Tambahan minimal supaya halaman berfungsi sebagai halaman error.
       (Layout artefak tetap seperti template; ini hanya caption & tombol.)
       ===================================================================== */

    body{
      font-family: 'Space Mono', ui-monospace, 'Courier New', monospace;
      margin: 0;
      padding: 0 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* TAG: Caption status + tombol kembali (diletakkan di bawah artefak) */
    .err-panel{
      margin-top: 2.5em;
      text-align: center;
      width: 100%;
      max-width: 30em;
    }
    .err-title{
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      margin: 0 0 0.4em;
    }
    .err-sub{
      font-size: 0.8rem;
      color: rgba(255,255,255,0.72);
      margin: 0 0 1.2em;
      word-break: break-word;
    }
    .err-home{
      display: inline-block;
      padding: 0.6em 1.4em;

      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .err-home:hover,
    .err-home:focus-visible{
      border-color: rgba(255,255,255,0.5);
      background-color: rgba(255,255,255,0.06);
    }
    .err-home:focus-visible{
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    /* TAG: Biar artefak tidak terlalu jauh ke atas di layar kecil */
    @media (max-width: 495px) {
      .main_wrapper{ transform: scale(0.55); transform-origin: center bottom; }
      .err-panel{ margin-top: 0; }
    }
  </style>

<body>
  <!-- =====================================================================

    .screen / .screenM berisi pesan yang diganti sesuai kondisi oleh JS.

              d="M70.343,70.343c-30.554,30.553-44.806,72.7-39.102,115.635l-29.738,3.951C-5.442,137.659,11.917,86.34,49.129,49.13C86.34,11.918,137.664-5.445,189.928,1.502l-3.95,29.738C143.041,25.54,100.895,39.789,70.343,70.343z"
            ></path>

  <!-- =====================================================================
    TAG: Panel status + tombol kembali - fungsional untuk halaman error.
    Pesan pada layar TV diisi otomatis sesuai kondisi (404/offline/error).
    ===================================================================== -->
  <div class="err-panel">
    <p class="err-title" id="err-title">Halaman Tidak Ditemukan</p>
    <p class="err-sub" id="err-sub">Alamat yang kamu buka tidak tersedia. Cek lagi atau kembali ke beranda.</p>
    <a class="err-home" href="./" id="err-home">&#8592; Kembali ke beranda</a>
  </div>

  <script>
    /* =====================================================================
       TAG: Logic halaman error - menentukan kondisi & mengisi teks TV.
       - 404 default (halaman tidak ditemukan)
       - offline (navigator.onLine === false)
       - error spesifik: baca dari ?e=... / #error=... atau sessionStorage.
          (error text ditampilkan di "layar TV" biar gampang di-fix)
       ===================================================================== */
    (function(){
      'use strict';

      // TAG: tempat pesan (dua layar: desktop .screenA & mobile .screenM)
      var screen = document.getElementById('msg-screen');
      var screenM = document.getElementById('msg-screen-m');
      var title = document.getElementById('err-title');
      var sub = document.getElementById('err-sub');

      // TAG: kumpulan pesan sesuai kondisi (bahasa-netral / id)
      var HOME_LABEL = 'Kembali ke beranda';

      // TAG: ambil pesan error dari ?msg=..., #error=..., atau sessionStorage
      function readErrorText(){
        try{
          var q = new URLSearchParams(location.search);
          if(q.get('msg')) return q.get('msg').slice(0, 60);
          if(q.get('error')) return q.get('error').slice(0, 60);
        }catch(e){ /* abaikan */ }
        try{
          var h = location.hash;
          if(h && h.indexOf('error=') === 1){
            return decodeURIComponent(h.slice(7)).slice(0, 60);
          }
          var stored = sessionStorage.getItem('err_msg');
          if(stored) return stored.slice(0, 60);
        }catch(e){ /* abaikan */ }
        return '';
      }

      // TAG: tentukan judul/keterangan sesuai kondisi
      function resolve(){
        var msg = readErrorText();
        var offline = (typeof navigator !== 'undefined' && navigator.onLine === false);

        if(msg){
          // TAG: error spesifik -> tampilkan pesan error di layar TV
          setText(msg);
          title.textContent = 'Terjadi Kesalahan';
          sub.textContent = 'Ini yang tertangkap: ' + msg + '. Kamu bisa kembali ke beranda.';
          return;
        }
        if(offline){
          // TAG: tidak ada internet
          setText('OFFLINE');
          title.textContent = 'Tidak Ada Koneksi Internet';
          sub.textContent = 'Periksa koneksi internetmu, lalu coba lagi.';
          return;
        }
        // TAG: default (404 / tidak ditemukan)
        setText('NOT FOUND');
        title.textContent = 'Halaman Tidak Ditemukan';
        sub.textContent = 'Alamat yang kamu buka tidak tersedia. Cek lagi atau kembali ke beranda.';
      }

      // TAG: isi teks di kedua layar TV, potong bila terlalu panjang
      function setText(t){
        if(screen) screen.textContent = t;
        if(screenM) screenM.textContent = t;
      }

      // TAG: isi & pasang tautan kembali ke beranda pakai base path
      var home = document.getElementById('err-home');
      if(home){ home.setAttribute('href', './'); home.textContent = '\u2190 ' + HOME_LABEL; }

      // TAG: jalankan, lalu re-evaluate saat status online/offline berubah
      resolve();
      if(typeof window !== 'undefined' && window.addEventListener){
        window.addEventListener('online', resolve);
        window.addEventListener('offline', resolve);
      }
    })();
  </script>
</body>
</html>
