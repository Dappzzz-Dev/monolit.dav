<!DOCTYPE html>
<html lang="id">
<head>
  <!-- TAG: Metadata halaman error (tidak diindex) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Kesalahan / Halaman Tidak Ditemukan</title>
  <style>
    /* =====================================================================
       TAG: Halaman error 404 - desain rapi setema situs (monokrome gelap +
       teks putih, font monospace). Layout normal (bukan absolute-position
       hack) supaya rapi di semua ukuran layar.
       ===================================================================== */
    :root{
      --bg: #0b0b0b;
      --panel: #141416;
      --border: rgba(255,255,255,0.12);
      --muted: rgba(255,255,255,0.68);
      --text: #ffffff;
    }
    *{ box-sizing: border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', ui-monospace, 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    /* TAG: Kartu utama halaman error */
    .err-card{
      width: 100%;
      max-width: 26rem;
      padding: 2.5rem 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    /* TAG: Angka 404 besar (dekoratif, tipis) */
    .err-code{
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--muted);
      opacity: 0.35;
      margin: 0 0 0.5rem;
      user-select: none;
    }

    /* TAG: Judul status (404 / offline / error) */
    .err-title{
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
      margin: 0 0 0.6rem;
    }

    /* TAG: Keterangan penjelas */
    .err-sub{
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 auto 1.5rem;
      max-width: 36ch;
      word-break: break-word;
    }

    /* TAG: Tombol kembali ke beranda */
    .err-home{
      display: inline-block;
      padding: 0.65em 1.6em;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
    }
    .err-home:hover,
    .err-home:focus-visible{
      border-color: rgba(255,255,255,0.5);
      background-color: rgba(255,255,255,0.06);
    }
    .err-home:focus-visible{
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    /* TAG: garis pemisah tipis di atas tombol */
    .err-divider{
      height: 1px;
      background: var(--border);
      width: 100%;
      margin: 0 0 1.5rem;
    }
  </style>
</head>
<body>
  <div class="err-card">
    <!-- TAG: Angka 404 dekoratif -->
    <p class="err-code">404</p>

    <!-- TAG: Judul status - diisi JS sesuai kondisi -->
    <h1 class="err-title" id="err-title">Halaman Tidak Ditemukan</h1>

    <!-- TAG: Keterangan - diisi JS sesuai kondisi -->
    <p class="err-sub" id="err-sub">Alamat yang kamu buka tidak tersedia. Cek lagi atau kembali ke beranda.</p>

    <!-- TAG: Garis pemisah -->
    <div class="err-divider"></div>

    <!-- TAG: Tombol kembali -->
    <a class="err-home" href="./" id="err-home">&#8592; Kembali ke beranda</a>
  </div>

  <script>
    /* =====================================================================
       TAG: Logic halaman error - menentukan kondisi & mengisi teks.
       - 404 default (halaman tidak ditemukan)
       - offline (navigator.onLine === false)
       - error spesifik: baca dari ?msg=... / ?error=... / #error=... /
         sessionStorage('err_msg'), lalu tampilkan pesannya.
       ===================================================================== */
    (function(){
      'use strict';

      var title = document.getElementById('err-title');
      var sub = document.getElementById('err-sub');
      var home = document.getElementById('err-home');

      // TAG: ambil pesan error dari berbagai sumber
      function readErrorText(){
        try{
          var q = new URLSearchParams(location.search);
          if(q.get('msg')) return q.get('msg').slice(0, 120);
          if(q.get('error')) return q.get('error').slice(0, 120);
        }catch(e){ /* abaikan */ }
        try{
          var h = location.hash;
          if(h && h.indexOf('error=') === 1) return decodeURIComponent(h.slice(7)).slice(0, 120);
          var stored = sessionStorage.getItem('err_msg');
          if(stored) return stored.slice(0, 120);
        }catch(e){ /* abaikan */ }
        return '';
      }

      // TAG: tentukan teks sesuai kondisi
      function resolve(){
        var msg = readErrorText();
        var offline = (typeof navigator !== 'undefined' && navigator.onLine === false);

        if(msg){
          title.textContent = 'Terjadi Kesalahan';
          sub.textContent = 'Ini yang tertangkap: "' + msg + '". Kamu bisa kembali ke beranda.';
          return;
        }
        if(offline){
          title.textContent = 'Tidak Ada Koneksi Internet';
          sub.textContent = 'Periksa koneksi internetmu, lalu coba lagi.';
          return;
        }
        title.textContent = 'Halaman Tidak Ditemukan';
        sub.textContent = 'Alamat yang kamu buka tidak tersedia. Cek lagi atau kembali ke beranda.';
      }

      if(home) home.setAttribute('href', './');
      resolve();
      if(typeof window !== 'undefined' && window.addEventListener){
        window.addEventListener('online', resolve);
        window.addEventListener('offline', resolve);
      }
    })();
  </script>
</body>
</html>
